
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123B68">

  <title>هاشم فارمسي | موسوعة مواد التجميل</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="main-header">
    <div class="brand">
      <div class="brand-icon">⚗️</div>
      <div>
        <h1>هاشم فارمسي</h1>
        <p>Hashim Pharmacy</p>
      </div>
    </div>

    <h2>موسوعة مواد التجميل</h2>
    <p class="subtitle">
      مرجع علمي شامل للمواد الخام وخصائصها واستخداماتها
    </p>
  </header>

  <main>

    <section class="search-section">
      <input
        type="search"
        id="searchInput"
        placeholder="ابحث عن اسم المادة أو الاسم العلمي..."
      >
    </section>

    <section class="categories-section">

      <h2>أقسام المواد الخام</h2>

      <div class="categories-grid">

        <button class="category-btn" data-category="actives">⚗️<span>المواد الفعالة</span></button>
        <button class="category-btn" data-category="extracts">🌿<span>المستخلصات الطبيعية</span></button>
        <button class="category-btn" data-category="acids">💧<span>الأحماض والمقشرات</span></button>
        <button class="category-btn" data-category="hair">🧴<span>مواد العناية بالشعر</span></button>
        <button class="category-btn" data-category="vitamins">💊<span>الفيتامينات</span></button>
        <button class="category-btn" data-category="preservatives">🛡️<span>المواد الحافظة</span></button>
        <button class="category-btn" data-category="solvents">💦<span>المذيبات والمرطبات</span></button>
        <button class="category-btn" data-category="thickeners">🧪<span>المكثفات والمثبتات</span></button>
        <button class="category-btn" data-category="cleansers">🫧<span>مواد التنظيف</span></button>
        <button class="category-btn" data-category="oils">🌱<span>الزيوت والزبدات</span></button>
        <button class="category-btn" data-category="waxes">🕯️<span>الشموع والمستحلبات</span></button>
        <button class="category-btn" data-category="proteins">🧬<span>البروتينات والسيليكونات</span></button>
        <button class="category-btn" data-category="colors">🎨<span>الألوان والأصباغ</span></button>
        <button class="category-btn" data-category="perfumes">🌸<span>العطور</span></button>
        <button class="category-btn" data-category="tools">📦<span>المواد والأدوات المساعدة</span></button>

      </div>
    </section>

  </main>

  <footer>
    <h3>هاشم فارمسي</h3>
    <p>علم ونتيجة</p>
    <p>Hashim Raw Materials Encyclopedia</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
